name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js LTS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Require a committed lockfile
        run: test -f package-lock.json
      - name: Install exact dependency graph
        run: npm ci
      - name: Dependency audit
        run: npm run audit
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: Unit and integration tests with coverage
        run: npm run test:coverage
      - name: Production dependency audit
        run: npm run audit:production


  actual-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate local Actual Budget Compose configuration
        run: docker compose config --quiet
      - name: Start pinned Actual Budget server
        run: |
          mkdir -p .local/actual-server-data
          docker compose up -d actual
      - name: Wait for local Actual Budget UI
        run: |
          for attempt in $(seq 1 45); do
            if curl --silent --show-error --fail --max-time 3 http://127.0.0.1:5006/ -o /dev/null; then
              echo "Actual Budget answered on the loopback-bound port."
              exit 0
            fi
            sleep 2
          done
          docker compose logs actual
          exit 1
      - name: Stop Actual Budget test service
        if: always()
        run: docker compose down --remove-orphans

  windows-quality:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Require a committed lockfile
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) { throw "package-lock.json is required for reproducible Windows installs." }
      - name: Install exact dependency graph on Windows
        run: npm ci
      - name: Dependency audit
        run: npm run audit
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: Unit and integration tests with coverage
        run: npm run test:coverage
      - name: Production dependency audit
        run: npm run audit:production
