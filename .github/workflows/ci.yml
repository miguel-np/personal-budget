name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write # Temporary: reduce to read after the initial lockfile is committed.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js LTS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: One-time lockfile bootstrap
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('package-lock.json') == ''
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock npm dependency graph"
            git push origin HEAD:main
          fi
      - name: Require a committed lockfile
        run: test -f package-lock.json
      - name: Install exact dependency graph
        run: npm ci
      - name: Dependency audit
        run: npm run audit
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        run: npm run typecheck && npm run build
      - name: Unit and integration tests with coverage
        run: npm run test:coverage
      - name: Production dependency audit
        run: npm run audit:production
