name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security
  cancel-in-progress: true
jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm run audit && npm run audit:production
      - name: Scan working tree for leaked secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 detect --source=/repo --no-git --redact --exit-code 1
