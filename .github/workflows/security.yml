name: Security
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Audit locked dependencies
        run: npm run audit && npm run audit:production
      - name: Scan incoming Git changes for leaked secrets
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            scan_range="${PR_BASE_SHA}..${CURRENT_SHA}"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            scan_range="${PUSH_BEFORE_SHA}..${CURRENT_SHA}"
          else
            scan_range="${CURRENT_SHA}^..${CURRENT_SHA}"
          fi
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 128 -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 detect --source=/repo --log-opts="$scan_range" --redact --exit-code 1
