name: Web search live acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-search-live-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Validate endpoint guard syntax
        run: node --check scripts/acceptance-endpoint.mjs && node --check scripts/validate-acceptance-endpoint.mjs
      - name: Test endpoint guard
        run: node --test scripts/acceptance-endpoint.test.mjs
      - name: Validate acceptance script syntax
        run: node --check scripts/web-search-live-acceptance.mjs
      - name: Validate acceptance endpoint configuration
        env:
          API_BASE_URL: ${{ secrets.PERSONAL_BUDGET_ACCEPTANCE_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Configure PERSONAL_BUDGET_ACCEPTANCE_API_URL with the HTTPS base URL of the deployed Personal Budget API."
            exit 1
          fi
          node scripts/validate-acceptance-endpoint.mjs "$API_BASE_URL"
      - name: Run live acceptance through the configured backend
        env:
          PERSONAL_BUDGET_ACCEPTANCE_API_URL: ${{ secrets.PERSONAL_BUDGET_ACCEPTANCE_API_URL }}
          PERSONAL_BUDGET_ACCEPTANCE_BEARER_TOKEN: ${{ secrets.PERSONAL_BUDGET_ACCEPTANCE_BEARER_TOKEN }}
        run: node scripts/web-search-live-acceptance.mjs
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-search-live-acceptance
          path: |
            web-search-live-acceptance-report.json
            web-search-live-acceptance-summary.md
          if-no-files-found: ignore
          retention-days: 30
