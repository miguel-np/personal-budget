name: Web search live acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-search-live-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate acceptance endpoint configuration
        env:
          API_BASE_URL: ${{ secrets.PERSONAL_BUDGET_ACCEPTANCE_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Configure PERSONAL_BUDGET_ACCEPTANCE_API_URL with the HTTPS base URL of the deployed Personal Budget API."
            exit 1
          fi
          node --input-type=module - "$API_BASE_URL" <<'NODE'
          const value = process.argv[2];
          const url = new URL(value);
          if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash || (url.pathname !== '/' && url.pathname !== '')) {
            throw new Error('Acceptance API must be an HTTPS origin without credentials, path, query or fragment.');
          }
          const host = url.hostname.toLowerCase();
          if (host === 'localhost' || host.endsWith('.local') || host.endsWith('.internal') || /^(127\.|10\.|192\.168\.|169\.254\.)/.test(host)) {
            throw new Error('Acceptance API must not target loopback or private hostnames.');
          }
          NODE
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run live acceptance through the configured backend
        env:
          PERSONAL_BUDGET_ACCEPTANCE_API_URL: ${{ secrets.PERSONAL_BUDGET_ACCEPTANCE_API_URL }}
          PERSONAL_BUDGET_ACCEPTANCE_BEARER_TOKEN: ${{ secrets.PERSONAL_BUDGET_ACCEPTANCE_BEARER_TOKEN }}
        run: node scripts/web-search-live-acceptance.mjs
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-search-live-acceptance
          path: |
            web-search-live-acceptance-report.json
            web-search-live-acceptance-summary.md
          if-no-files-found: ignore
          retention-days: 30
