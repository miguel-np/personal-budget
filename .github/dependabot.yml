version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '08:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      npm-patch-and-minor:
        update-types:
          - patch
          - minor
      npm-major:
        update-types:
          - major
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '08:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(actions)
