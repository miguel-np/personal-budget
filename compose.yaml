services:
  actual:
    image: ${ACTUAL_IMAGE:-actualbudget/actual-server:26.10.0}
    container_name: personal-budget-actual
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5006:5006"
    volumes:
      - ./.local/actual-server-data:/data
